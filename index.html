<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Key Generator</title>
<style>*{box-sizing:border-box;font-family:Arial,sans-serif}html,body{margin:0;overscroll-behavior:none;background:#0f172a;color:#0f172a}.c{background:#fff;border-radius:10px;padding:14px;margin:10px auto;max-width:480px}input,textarea,select{width:100%;padding:10px;margin:4px 0;border:1px solid #94a3b8;border-radius:6px;font-size:15px}button{width:100%;padding:11px;margin:4px 0;border:0;border-radius:6px;background:#1e3a8a;color:#fff;font-weight:bold;font-size:14px}.g{background:#16a34a}.r{background:#b91c1c}.d{background:#475569}.m{font-family:monospace;word-break:break-all;background:#f1f5f9;padding:8px;border-radius:6px;font-size:12px}small{color:#64748b}</style></head><body><div id="app"></div>
<script>
const isNative = () => !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()), NP = n => window.Capacitor && Capacitor.Plugins && Capacitor.Plugins[n];
{ const _wo = window.open.bind(window); window.open = (u, t) => { if(isNative() && NP('AppLauncher')){ NP('AppLauncher').openUrl({ url: u }); return null; } return _wo(u, t); }; }
const LK = (() => { const te = new TextEncoder(), td = new TextDecoder();
  const b64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while(s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  const ECP = { name: 'ECDSA', namedCurve: 'P-256' }, ESG = { name: 'ECDSA', hash: 'SHA-256' };
  async function sign(priv, obj){ const k = await crypto.subtle.importKey('jwk', priv, ECP, false, ['sign']), p = te.encode(JSON.stringify(obj)); return 'SSE1-' + b64u(p) + '.' + b64u(await crypto.subtle.sign(ESG, k, p)); }
  async function verify(pub, key, code){ try { key = String(key || '').trim().replace(/\s+/g, ''); if(key.indexOf('SSE1-') !== 0) return null; const [p, sg] = key.slice(5).split('.'), k = await crypto.subtle.importKey('jwk', pub, ECP, false, ['verify']);
      if(!(await crypto.subtle.verify(ESG, k, unb64u(sg), unb64u(p)))) return null; const o = JSON.parse(td.decode(unb64u(p))); return (o.d === code && o.t === 'L') ? o : null; } catch(e){ return null; } }
  return { sign, verify, b64u, unb64u, te, td }; })();
const KG_PUB = {"kty": "EC", "crv": "P-256", "x": "3x6ayC9K7JqDpfZVVf7CSqvEEdZtTbryyqr73Qg8NZ0", "y": "VqfNP9zyfZLWKt_CEWHZQ7LyUVtTzTfl_cOOwU453vA"}, KG_ENC = {"s": "JFD6qldBuBnEmkBkQwnSSg", "i": "5nxJeuEdokltjkjR", "c": "8U8xbq4dVNHT7ayauyWKbj0JJq38Pydi2MJQrdm8WVFnCTL2-T0YFqneIw135H7qX-DMEdTzJan7qmhun21oxMe4dB5GEToRRtuIj5zqNC_u-fzlqD6zi8sIddF3FzQVSQiu3PYPFBRHryMQmt0W4m6fUy6Wbz2i7z1J_MMf7fShWDRNZFiReS3JiWUl-o04RgtXS_joL2Hdxsw6LSLiU6wSvpPVt9ppNgfTOWaWr-iepLaHJDAAo9bdcGYvPMamBwc5xgPfvbvamii83tES6FfXLE8tiwUZhnEqS-eb"}, A = document.getElementById('app'), $ = id => document.getElementById(id);
let PRIV = null, fails = 0, lockUntil = 0;
const getLog = () => JSON.parse(localStorage.getItem('kg_log') || '[]'), esc = t => String(t || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function pinKey(pin, salt){ const km = await crypto.subtle.importKey('raw', LK.te.encode(pin), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); }
async function encPriv(jwk, pin){ const s = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), k = await pinKey(pin, s); return { s: LK.b64u(s), i: LK.b64u(iv), c: LK.b64u(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, LK.te.encode(JSON.stringify(jwk)))) }; }
async function decPriv(b, pin){ const k = await pinKey(pin, LK.unb64u(b.s)); return JSON.parse(LK.td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: LK.unb64u(b.i) }, k, LK.unb64u(b.c)))); }
const curEnc = () => JSON.parse(localStorage.getItem('kg_enc') || 'null') || KG_ENC, pubNow = () => JSON.parse(localStorage.getItem('kg_pub') || 'null') || KG_PUB, firstRun = () => !localStorage.getItem('kg_pinset');
function lockScreen(){ A.innerHTML = '<div class="c" style="text-align:center"><div style="font-size:34px">🔐</div><h2>Key Generator</h2><small>' + (firstRun() ? 'First time: enter the INITIAL PIN given to you, then you will set your own PIN.' : 'Enter your PIN') + '</small><input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="PIN"><div id="msg" style="color:#b91c1c;min-height:18px"></div><button onclick="unlock()">Unlock</button></div>'; $('pin').addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); }); }
async function unlock(){ const pin = $('pin').value; $('pin').value = ''; if(Date.now() < lockUntil) return $('msg').innerText = 'Locked. Wait ' + Math.ceil((lockUntil - Date.now()) / 1000) + 's';
  try { PRIV = await decPriv(curEnc(), pin); fails = 0; } catch(e){ fails++; if(fails >= 5){ lockUntil = Date.now() + 60000; fails = 0; } return $('msg').innerText = '❌ Wrong PIN'; }
  if(firstRun()) return setPinScreen(); main(); }
function setPinScreen(){ A.innerHTML = '<div class="c"><h3>Set your own PIN</h3><small>6 digits or more. Do not forget it.</small><input type="password" id="p1" inputmode="numeric" placeholder="New PIN"><input type="password" id="p2" inputmode="numeric" placeholder="Confirm new PIN"><button onclick="savePin()">Save PIN</button></div>'; }
async function savePin(){ const a = $('p1').value, b = $('p2').value; if(a.length < 6 || a !== b) return alert('PIN must be 6+ digits and both must match.'); localStorage.setItem('kg_enc', JSON.stringify(await encPriv(PRIV, a))); localStorage.setItem('kg_pinset', '1'); main(); }
function main(){ A.innerHTML = '<div class="c"><h3 style="margin:0">🔑 Generate Lifetime Key</h3><small>Fee: ₹5999 - one device, lifetime</small><input id="code" placeholder="Customer Device Code (XXXX-XXXX-XXXX-XXXX)" autocapitalize="characters"><input id="nm" placeholder="Customer / shop name"><input id="amt" type="number" value="5999" placeholder="Amount received"><button class="g" onclick="gen()">Generate Key</button><div id="out"></div></div>' +
  '<div class="c"><h3 style="margin:0 0 6px">📒 Issued keys</h3><input id="q" placeholder="Search name / code" oninput="hist()"><div id="hist"></div><button class="d" onclick="csv()">Share list as CSV</button></div>' +
  '<div class="c"><h3 style="margin:0 0 6px">⚙️ Settings</h3><button class="d" onclick="chPin()">Change PIN</button><button class="d" onclick="showPub()">Show public key</button><button class="r" onclick="newPair()">New key pair (danger)</button><button class="d" onclick="location.reload()">🔒 Lock</button></div>'; hist(); }
async function gen(){ const code = $('code').value.trim().toUpperCase(), nm = $('nm').value.trim(); if(!/^[0-9A-F]{4}(-[0-9A-F]{4}){3}$/.test(code)) return alert('Device Code format is wrong.'); if(!nm) return alert('Enter customer name.');
  const key = await LK.sign(PRIV, { d: code, n: nm, t: 'L', i: new Date().toISOString().slice(0, 10) }), L = getLog(); L.unshift({ n: nm, c: code, d: new Date().toISOString().slice(0, 10), a: +$('amt').value || 0, k: key }); localStorage.setItem('kg_log', JSON.stringify(L));
  $('out').innerHTML = '<div class="m" id="kt">' + key + '</div><button onclick="cp()">📋 Copy key</button><button class="g" onclick="wa()">💬 Send on WhatsApp</button>'; window._k = key; hist(); }
const cp = () => { navigator.clipboard.writeText(window._k).then(() => alert('Key copied')).catch(() => prompt('Copy key:', window._k)); }, wa = () => window.open('https://wa.me/?text=' + encodeURIComponent('Your Registration Key (Lifetime):\n\n' + window._k), '_blank');
function hist(){ const q = ($('q') && $('q').value || '').toLowerCase(); $('hist').innerHTML = getLog().map((x, i) => [x, i]).filter(([x]) => (x.n + x.c).toLowerCase().includes(q)).map(([x, i]) => '<div style="border-bottom:1px solid #e2e8f0;padding:6px 0;font-size:13px"><b>' + esc(x.n) + '</b> · ₹' + x.a + '<br><small>' + x.c + ' · ' + x.d + '</small> <a href="#" onclick="again(' + i + ');return false">view key</a></div>').join('') || '<small>No keys yet.</small>'; }
function again(i){ const x = getLog()[i]; window._k = x.k; $('code').value = x.c; $('nm').value = x.n; $('out').innerHTML = '<div class="m">' + x.k + '</div><button onclick="cp()">📋 Copy key</button><button class="g" onclick="wa()">💬 Send on WhatsApp</button>'; scrollTo(0, 0); }
function csv(){ const t = 'Name,DeviceCode,Date,Amount\n' + getLog().map(x => [x.n, x.c, x.d, x.a].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n'); if(navigator.share) navigator.share({ title: 'Issued keys', text: t }).catch(() => {}); else prompt('Copy:', t); }
async function chPin(){ const o = prompt('Current PIN:'); if(o === null) return; try { await decPriv(curEnc(), o); } catch(e){ return alert('Wrong PIN'); } const n = prompt('New PIN (6+ digits):'); if(!n || n.length < 6) return alert('Too short'); localStorage.setItem('kg_enc', JSON.stringify(await encPriv(PRIV, n))); alert('PIN changed'); }
function showPub(){ prompt('Public key (already inside the customer app):', JSON.stringify(pubNow())); }
async function newPair(){ if(!confirm('This creates a NEW signing key. Customer apps built with the old public key will NOT accept new keys. Continue?') || !confirm('Really sure?')) return; const pin = prompt('Enter a PIN for the new key (6+ digits):'); if(!pin || pin.length < 6) return;
  const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']), pub = await crypto.subtle.exportKey('jwk', kp.publicKey); PRIV = await crypto.subtle.exportKey('jwk', kp.privateKey);
  localStorage.setItem('kg_enc', JSON.stringify(await encPriv(PRIV, pin))); localStorage.setItem('kg_pub', JSON.stringify({ kty: pub.kty, crv: pub.crv, x: pub.x, y: pub.y })); localStorage.setItem('kg_pinset', '1'); prompt('NEW public key - paste it into LIC_PUB of the customer app and rebuild it:', JSON.stringify(pubNow())); }
if(!(window.crypto && crypto.subtle)) A.innerHTML = '<div class="c">Please open the installed app.</div>'; else lockScreen();
</script></body></html>
